# omp-stack managed baseline for: omp --profile openai-codex
# scripts/omp-stack symlinks the profile's config.yml to this file; edit
# settings here and review the result with git diff like any other change.
providers:
  webSearchOrder: []

# Do not probe unused local inference endpoints at startup.
disabledProviders:
  - ollama
  - llama.cpp
  - lm-studio

defaultThinkingLevel: auto

modelRoles:
  default: openai-codex/gpt-5.6-terra
  smol: openai-codex/gpt-5.6-luna
  tiny: openai-codex/gpt-5.6-luna:low
  vision: openai-codex/gpt-5.6-luna
  execute: openai-codex/gpt-5.6-luna
  task: openai-codex/gpt-5.6-terra
  plan: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:high
  review_aux: openai-codex/gpt-5.6-terra:high
  critical: openai-codex/gpt-5.6-sol:xhigh
  commit: openai-codex/gpt-5.6-luna:low

# Native backstop for Flow's external-effect gate. Keep publication commands
# on the direct Bash/gh surface so these explicit prompt policies apply.
# `gh api` prompts only when a method/body flag is present as its own token;
# tests/bash-patterns.test.mjs proves this list against OMP's matcher.
bash:
  patterns:
    - match: "git push*"
      approval: prompt
    - match: "gh pr create*"
      approval: prompt
    - match: "gh pr merge*"
      approval: prompt
    - match: "gh pr review*"
      approval: prompt
    - match: "gh pr comment*"
      approval: prompt
    - match: "gh pr edit*"
      approval: prompt
    - match: "gh pr close*"
      approval: prompt
    - match: "gh issue comment*"
      approval: prompt
    - match: "gh release create*"
      approval: prompt
    - match: "gh api -X*"
      approval: prompt
    - match: "gh api * -X*"
      approval: prompt
    - match: "gh api --method*"
      approval: prompt
    - match: "gh api * --method*"
      approval: prompt
    - match: "gh api -f*"
      approval: prompt
    - match: "gh api * -f*"
      approval: prompt
    - match: "gh api -F*"
      approval: prompt
    - match: "gh api * -F*"
      approval: prompt
    - match: "gh api --field*"
      approval: prompt
    - match: "gh api * --field*"
      approval: prompt
    - match: "gh api --raw-field*"
      approval: prompt
    - match: "gh api * --raw-field*"
      approval: prompt
    - match: "gh api --input*"
      approval: prompt
    - match: "gh api * --input*"
      approval: prompt

# Keep per-dispatch effort disabled so an orchestrator cannot silently turn a
# cheap worker into the selected model's highest reasoning level.
task:
  maxConcurrency: 3
  maxRecursionDepth: 2
  enableEffort: false
  isolation:
    enabled: true

isolation:
  backend: auto

symbolPreset: nerd
composer:
  shape: rule
theme:
  dark: titanium
  light: light
setupVersion: 2
statusLine:
  preset: custom
  leftSegments:
    - pi
    - model
    - mode
    - git
    - context_pct
  rightSegments:
    - session_name
    - usage
  separator: powerline-thin
  sessionAccent: true
  compactThinkingLevel: true
  contextLine: embedded
  segmentOptions:
    model:
      showThinkingLevel: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
colorBlindMode: true
tui:
  codexResetFireworks: true
cycleOrder:
  - smol
  - default
  - slow
dev:
  autoqaConsent: granted
codexResets:
  autoRedeem: "no"
