# omp-stack managed baseline for: omp --profile openai-codex
# scripts/omp-stack copies this file only when the profile has no config.yml.
providers:
  webSearchOrder: []

defaultThinkingLevel: auto

modelRoles:
  default: openai-codex/gpt-5.6-terra
  smol: openai-codex/gpt-5.6-luna
  tiny: openai-codex/gpt-5.6-luna:low
  vision: openai-codex/gpt-5.6-luna
  execute: openai-codex/gpt-5.6-luna
  task: openai-codex/gpt-5.6-terra
  plan: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:high
  review_aux: openai-codex/gpt-5.6-terra:high
  critical: openai-codex/gpt-5.6-sol:xhigh
  commit: openai-codex/gpt-5.6-luna:low

# Native backstop for Flow's external-effect gate. Explicit prompt policies
# remain active even under OMP's default yolo approval mode. eval is prompted
# because bash command patterns do not contain subprocesses launched by eval.
tools:
  approval:
    eval: prompt

bash:
  patterns:
    - match: "git push*"
      approval: prompt
    - match: "gh pr create*"
      approval: prompt
    - match: "gh pr merge*"
      approval: prompt
    - match: "gh pr review*"
      approval: prompt
    - match: "gh pr comment*"
      approval: prompt
    - match: "gh issue comment*"
      approval: prompt
    - match: "gh release create*"
      approval: prompt
    - match: "gh api*"
      approval: prompt
    - match: "tea pr create*"
      approval: prompt
    - match: "tea pr merge*"
      approval: prompt
    - match: "tea comment*"
      approval: prompt

# Keep per-dispatch effort disabled so an orchestrator cannot silently turn a
# cheap worker into the selected model's highest reasoning level.
task:
  maxConcurrency: 3
  maxRecursionDepth: 2
  enableEffort: false
  isolation:
    enabled: true

isolation:
  backend: auto

symbolPreset: nerd
composer:
  shape: rule
theme:
  dark: titanium
  light: light
setupVersion: 2
statusLine:
  preset: custom
  leftSegments:
    - pi
    - model
    - mode
    - git
    - context_pct
  rightSegments:
    - session_name
    - usage
  separator: powerline-thin
  sessionAccent: true
  compactThinkingLevel: true
  contextLine: embedded
  segmentOptions:
    model:
      showThinkingLevel: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
colorBlindMode: true
tui:
  codexResetFireworks: true
cycleOrder:
  - smol
  - default
  - slow
dev:
  autoqaConsent: granted
codexResets:
  autoRedeem: "no"
