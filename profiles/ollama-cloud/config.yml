# omp-stack managed baseline for: omp --profile ollama-cloud
# scripts/omp-stack copies this file only when the profile has no config.yml.
providers:
  webSearchOrder: []

defaultThinkingLevel: auto

modelRoles:
  # Cheap background / mechanical roles.
  smol: ollama-cloud/deepseek-v4.1-flash:low
  tiny: ollama-cloud/deepseek-v4.1-flash:low
  commit: ollama-cloud/deepseek-v4.1-flash:low

  # Controller + deliberate judgment. Unit 2 showed GLM was capable at coding
  # but less reliable at orchestration, so v8 keeps DeepSeek V4 Pro as Main.
  default: ollama-cloud/deepseek-v4-pro:high
  plan: ollama-cloud/deepseek-v4-pro:high
  slow: ollama-cloud/deepseek-v4-pro:high

  # Keep auxiliary review on a separate model family from the controller.
  review_aux: ollama-cloud/glm-5.3-flash:high

  # Constrained plan execution / semantic fallback / multimodal work.
  execute: ollama-cloud/glm-5.3-flash:high
  task: ollama-cloud/glm-5.3-flash:high
  vision: ollama-cloud/glm-5.3-flash:high

  # Explicit frontier escalation only. Kimi K3 uses OMP's generic Ollama Cloud
  # effort ladder, where high is the strongest advertised effort.
  critical: ollama-cloud/kimi-k3:high

# Native backstop for Flow's external-effect gate. Keep publication commands
# on the direct Bash/forge surface so these explicit prompt policies apply.
bash:
  patterns:
    - match: "git push*"
      approval: prompt
    - match: "gh pr create*"
      approval: prompt
    - match: "gh pr merge*"
      approval: prompt
    - match: "gh pr review*"
      approval: prompt
    - match: "gh pr comment*"
      approval: prompt
    - match: "gh issue comment*"
      approval: prompt
    - match: "gh release create*"
      approval: prompt
    - match: "gh api*"
      approval: prompt
    - match: "tea pr create*"
      approval: prompt
    - match: "tea pr merge*"
      approval: prompt
    - match: "tea comment*"
      approval: prompt

# Keep per-dispatch effort disabled so an orchestrator cannot silently turn a
# cheap worker into the selected model's highest reasoning level.
task:
  maxConcurrency: 3
  maxRecursionDepth: 2
  enableEffort: false
  isolation:
    enabled: true

isolation:
  backend: auto

symbolPreset: nerd
composer:
  shape: rule
theme:
  dark: titanium
  light: light
setupVersion: 2
statusLine:
  preset: custom
  leftSegments:
    - pi
    - model
    - mode
    - git
    - context_pct
  rightSegments:
    - session_name
    - usage
  separator: powerline-thin
  sessionAccent: true
  compactThinkingLevel: true
  contextLine: embedded
  segmentOptions:
    model:
      showThinkingLevel: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
colorBlindMode: true
tui:
  codexResetFireworks: true
cycleOrder:
  - smol
  - default
  - slow
dev:
  autoqaConsent: granted
